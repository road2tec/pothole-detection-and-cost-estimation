name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/pothole_test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      AI_SERVICE_TOKEN: ci-service-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: model-cache
          key: hf-models-42b586f1-5426e4f0
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      # Downloads the pinned pretrained checkpoints (cached) and runs genuine inference tests.
      - run: python -m pytest
        env:
          MODEL_CACHE_DIR: ${{ github.workspace }}/model-cache
